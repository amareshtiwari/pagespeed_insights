<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>PageSpeed Insights — Action Items</title>
  <link rel="stylesheet" href="css/styles.css?v=16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <svg class="brand__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
        </svg>
        <h1 class="brand__title">PageSpeed Insights</h1>
      </div>
      <nav class="app-nav">
        <a href="cwv.html" class="app-nav__link">CWV Intelligence</a>
        <a href="dashboard.html" class="app-nav__link">Dashboard</a>
        <a href="trends.html" class="app-nav__link">Trends</a>
        <a href="actions.html" class="app-nav__link app-nav__link--active">Action Items</a>
        <a href="index.html" class="app-nav__link">Analyze</a>
        <a href="reports.html" class="app-nav__link">History</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="reports-header card">
      <div>
        <h2>Action Items</h2>
        <p class="reports-header__sub">Lighthouse-based suggestions to improve scores for each brand. Prioritized by impact and severity.</p>
      </div>
    </section>

    <section class="filters-bar card">
      <div class="filters-bar__fields">
        <select id="filter-brand"><option value="">All brands</option></select>
        <select id="filter-platform"><option value="">All platforms</option></select>
        <select id="filter-region"><option value="">All regions</option></select>
        <select id="filter-group"><option value="">All types</option><option value="PM">PM</option><option value="Non-PM">Non-PM</option></select>
      </div>
    </section>

    <section class="dashboard-summary dashboard-summary--reserve" id="actions-summary"></section>

    <p id="actions-error" class="form-error" hidden></p>

    <div id="actions-loading" class="loading card" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading action items…</p>
    </div>

    <section id="actions-content" hidden>
      <div id="actions-list" class="actions-list"></div>
      <p class="reports-empty" id="actions-empty" hidden>No action items yet. Run PageSpeed analysis on your brands first.</p>
    </section>
  </main>

  <script src="js/boot.js?v=1"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/utils.js?v=4"></script>
  <script src="js/actions.js?v=2"></script>
</body>
</html>
